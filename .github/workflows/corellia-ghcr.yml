# Drop into the kevthoma/newserv fork at .github/workflows/corellia-ghcr.yml
# Builds newserv's in-repo Dockerfile and pushes to ghcr.io/kevthoma/newserv.
# Mirrors the portal's GHCR flow: build :latest (+ sha), pull on Unraid via Force-update.
name: Corellia GHCR

on:
  workflow_dispatch:            # build on demand
  push:
    branches: [ master ]        # and whenever master moves (e.g. after syncing upstream)
    paths-ignore:
      - '**.md'

concurrency:
  group: corellia-ghcr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/newserv
          tags: |
            # :latest ONLY from the default branch. workflow_dispatch accepts ANY ref, so without
            # this guard building a feature branch on demand would publish it as :latest -- the tag
            # the Unraid containers pull on Force-update -- and untested code could reach prod via
            # any later container recreate, silently. Same hole the client installers already had
            # closed ("stage and promote only after passing"); this is the Docker equivalent.
            type=raw,value=latest,enable={{is_default_branch}}
            # Always tagged by commit, so a branch CAN be built and tested by sha without
            # ever claiming to be latest.
            type=sha

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # amd64 only — Unraid is x86_64; skipping arm64 roughly halves build time.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
